services:
  db:
    image: postgres:16-alpine
    container_name: eng_play_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eng_play
    ports:
      - "5434:5432"
    volumes:
      - eng_play_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eng_play"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: eng_play_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/eng_play
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  eng_play_pgdata:
